version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: incident-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - incident-network

  backend:
    build: ./backend
    container_name: incident-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DATABASE_NAME=incident_management
    depends_on:
      - mongodb
    networks:
      - incident-network

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: incident-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - incident-network

volumes:
  mongodb_data:

networks:
  incident-network:
    driver: bridge
